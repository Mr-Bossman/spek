name: Windows x86_64

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            mingw-w64-clang-x86_64-autotools
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-pkg-config
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-wxwidgets3.2

      - name: autogen
        run: ./autogen.sh

      - name: build
        run: make

      - name: check
        run: make check

      - name: distcheck
        run: make distcheck

      - name: copy
        run: |
          cp -r src/.libs src/libs
          cp -r src/.deps src/deps

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spek-windows-clang-x86_64
          path: |
            src/
